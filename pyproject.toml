[project]
name = "noshow"
version = "0.1.0"
description = "Framework de normalização de dados para predição de no-show com Redes Bayesianas (TCC)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
