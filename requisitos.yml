# Numeração global e única (nunca reutilizar um número): RF-NNN funcional · RNF-NNN não funcional ·
# CA-NNN critério de aceitação de tarefa técnica. Cada item aponta implementação, verificação e PR de entrega.
# `cenarios` liga cada cenário de aceite (na ordem da issue) aos requisitos que ele verifica.
#
# Gerar a matriz e sincronizar as issues:  .venv/bin/python scripts/rastreabilidade.py [--sincronizar]

